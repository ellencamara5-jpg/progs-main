<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Basic HTML page with javascript.
    <p>Get the max number from an input.
    </p>

    How many number you want to show?
    <input type="text" id="max" value="10" size="3">

    <p id="html-numbers">
    </p>

    <button onClick="showNumbers()">
        Show numbers
    </button>

    <script>

        function showNumbers() {
            //get the "max" value
            const max = document.getElementById("max").value;            

            // prepare a content
            let s = "";

            for (let i = 0; i < max; i++) {
                console.log(i);
                // add the number in a string
                s = s + ` ${i} <br/>`;
            }
            // get the elements on the page
            // the elements are located by "id"
            const element1 = document.getElementById("html-numbers");
            const element2 = document.getElementById("text-numbers");
            // put the content as HTML
            element1.innerHTML = s;
            // put the content as plain text (without HTML interpretation)
            element2.textContent = s;
        }

    </script>
</body>

</html>
