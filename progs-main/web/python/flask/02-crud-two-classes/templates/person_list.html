<!DOCTYPE html>
<html>
<head>
    <title>Persons</title>
</head>
<body>
    <h1>Persons</h1>
    <a href="{{ url_for('home') }}">Home</a> | <a href="{{ url_for('create_person') }}">+ Add Person</a>
    <ul>
        {% for p in persons %}
            <li>
                {{ p.name }} ({{ p.email }} | {{ p.telephone }})
                <a href="{{ url_for('update_person', person_id=p.id) }}">Edit</a>
                <a href="{{ url_for('delete_person', person_id=p.id) }}" onclick="return confirm('Delete this person?');">Delete</a>
            </li>
        {% else %}
            <li>No persons found.</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('list_cars') }}">Go to Cars</a>
</body>
</html>
