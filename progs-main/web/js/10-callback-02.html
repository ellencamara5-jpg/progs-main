<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Greetings II:
    <p id="greetings">
    </p>

    <script>

        // função callback com parâmetro
        function sayGoodbye(quemFalou) {
            const g = document.getElementById("greetings");
            g.innerHTML += `Opa, estou aqui, ${quemFalou}!<br>`;
        }

        // função principal
        function cumprimentar(quemCumprimentou, 
                                cumprimentado, 
                                callback) {
            const g = document.getElementById("greetings");
            g.innerHTML += `Atenção, ${cumprimentado}!<br>`;
            // invocar a função callback
            callback(quemCumprimentou);
        }

        // executar a função principal :-)
        cumprimentar("João", "Maria", sayGoodbye);
        cumprimentar("João", "Paulo", sayGoodbye);

    </script>

</body>

</html>
