<!DOCTYPE html>
<html>
<head>
    <title>Cars</title>
</head>
<body>
    <h1>Cars</h1>
    <a href="{{ url_for('home') }}">Home</a> | <a href="{{ url_for('create_car') }}">+ Add Car</a>
    <ul>
        {% for c in cars %}
            <li>
                {{ c.maker }} {{ c.model }} ({{ c.year }})
                {% if c.owner %}
                    - Owner: {{ c.owner.name }}
                {% else %}
                    - No owner
                {% endif %}
                <a href="{{ url_for('update_car', car_id=c.id) }}">Edit</a>
                <a href="{{ url_for('delete_car', car_id=c.id) }}" onclick="return confirm('Delete this car?');">Delete</a>
            </li>
        {% else %}
            <li>No cars found.</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('list_persons') }}">Go to Persons</a>
</body>
</html>
