<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Basic HTML page with javascript.
    <p>Number are being showed in the console
        AND in the page content :-)
    </p>

    HTML content:
    <p id="html-numbers">
    </p>
    
    Textual content:
    <p id="text-numbers">
    </p>

    <script>
        // prepare a content
        let s = "";

        for (let i = 0; i < 10; i++) {
            console.log(i);
            // add the number in a string
            s = s + ` ${i} <br> `;
        }
        // get the elements on the page
        // the elements are located by "id"
        const element1 = document.getElementById("html-numbers");
        const element2 = document.getElementById("text-numbers");
        // put the content as HTML
        element1.innerHTML = s;
        // put the content as plain text (without HTML interpretation)
        element2.textContent = s;
    </script>
</body>

</html>
