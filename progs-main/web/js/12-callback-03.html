<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>
<body>
    <p id="mensagem"></p>
    <script>
        function acrescentarNaTela(mensagem) {
            const g = document.getElementById("mensagem");
            g.innerHTML += mensagem + "<br>";
        }
        // função callback com parâmetro
        function sayGoodbye(quemFalou) {
            acrescentarNaTela(`Adeus, ${quemFalou}!`);
        }
        // função principal
        function cumprimentar(quemCumprimentou, 
                                cumprimentado, 
                                callback) {
            acrescentarNaTela(`Atenção, ${cumprimentado}!`);
            // invocar a função callback
            callback(quemCumprimentou);
        }
        // executar a função principal :-)
        cumprimentar("João", "Maria", sayGoodbye);
        cumprimentar("João", "Paulo", sayGoodbye);
    </script>
</body>
</html>
