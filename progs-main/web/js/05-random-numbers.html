<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Random numbers:
    <p id="numbers">
    </p>

    <script>
        // prepare a content
        let s = "";

        for (let i = 0; i < 10; i++) {
            // get a random number
            // this number comes between 0 and 1
            let n1 = Math.random();
            // grow the number1
            // if I want numbers between 0 and 1000, 
            // multiply it by 1000
            let n2 = n1 * 1000;
            // extract the integer part of the number
            let n3 = parseInt(n2);
            // store the number in a string
            s = s + `${n3}, `;
        }

        // locate the element on the screen
        const element1 = document.getElementById("numbers");
        // put the content as HTML
        element1.innerHTML = s;
        // put the content as plain text (without HTML interpretation)
    </script>
</body>

</html>
