<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Anonymous Functions
    <p id="doit">
    </p>

    <script>

        // MODO 1:
        // função anônima associada a uma variável
        const mostrar = function () {
            const d = document.getElementById("doit");
            d.innerHTML += "Olá, estou associada a uma variável :-) <br>";
        };
        // executando a função anônima
        mostrar();

        // MODO 2: 
        // função anônima associada a outras funções (callback)
        setTimeout(function () {
            const d = document.getElementById("doit");
            d.innerHTML += "Pronto, depois de 2 segundos, estou aqui!<br>";
        }, 2000);

        // MODO 3:
        // função anônima chamada imediatamente após a definição 
        // (IIFE - Immediately Invoked Function Expression)
        (function () {
            const d = document.getElementById("doit");
            d.innerHTML += "Olá, estou aqui, mesmo sem ser chamada :-o <br>";
        })();
        // os parênteses ao final da função fazem com que ela seja 
        // executada imediatamente após a definição

        // MODO 4:
        // usando Arrow Function
        // na verdade essa função não é anônima, pois tem um nome (quadrado), 
        // mas é uma função de expressão, ou seja, é associada a uma variável
        const quadrado = (x) => x * x;
        const d = document.getElementById("doit");
        d.innerHTML += `O quadrado de 5 é ${quadrado(5)} <br>`;

    </script>

</body>

</html>
