<!DOCTYPE html>
<html>
<head>
    <title>Edit Car</title>
</head>
<body>
    <h1>Edit Car</h1>
    <form method="post">
        Maker: <input type="text" name="maker" value="{{ car.maker }}" required><br>
        Model: <input type="text" name="model" value="{{ car.model }}" required><br>
        Year: <input type="number" name="year" value="{{ car.year }}" required><br>
        Owner:
        <select name="owner_id">
            <option value="">-- No Owner --</option>
            {% for p in persons %}
                <option value="{{ p.id }}" {% if car.owner and car.owner.id == p.id %}selected{% endif %}>
                    {{ p.name }}
                </option>
            {% endfor %}
        </select><br>
        <button type="submit">Update</button>
    </form>
    <a href="{{ url_for('list_cars') }}">Back to list</a>
</body>
</html>
