<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CRUD de Filmes</h1>

        <form id="filmeForm">
            <input type="hidden" id="filmeId">

            <input type="text" id="nome" placeholder="Nome" required>
            <input type="number" id="ano" placeholder="Ano" required>
            <input type="text" id="categoria" placeholder="Categoria" required>
            <input type="number" id="classificacao" placeholder="Classificação" required min="0" max="120">

            <button type="submit">Salvar</button>
            <!-- no código original primeiro, o botão abaixo estava SEM ID, 
             e isso gerava erro no console javascript do navegador -->
            <button type="button" id="cancelarBtn" onclick="limparFormulario()">Cancelar</button>
        </form>

        <hr>

        <h2>Lista de Filmes</h2>
        <div id="filmesLista"></div>
    </div>

    <script type="module" src="./dist/script.js"></script>
</body>
</html>
