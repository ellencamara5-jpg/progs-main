<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Greetings
    <p id="greetings">
    </p>

    <script>

        // função callback
        function sayGoodbye() {
            const g = document.getElementById("greetings");
            g.innerHTML += "Goodbye!<br>";
        }

        // função principal
        function cumprimentar(nome, callback) {
            const g = document.getElementById("greetings");
            g.innerHTML += `Hello, ${nome}!<br>`;
            // invocar a função callback
            callback();
        }

        // executar a função principal :-)
        cumprimentar("Alice", sayGoodbye);
        cumprimentar("John", sayGoodbye);

    </script>

</body>

</html>
