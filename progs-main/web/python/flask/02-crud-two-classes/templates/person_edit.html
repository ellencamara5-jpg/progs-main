<!DOCTYPE html>
<html>
<head>
    <title>Edit Person</title>
</head>
<body>
    <h1>Edit Person</h1>
    <form method="post">
        Name: <input type="text" name="name" value="{{ person.name }}" required><br>
        Email: <input type="email" name="email" value="{{ person.email }}" required><br>
        Telephone: <input type="text" name="telephone" value="{{ person.telephone }}" required><br>
        <button type="submit">Update</button>
    </form>
    <a href="{{ url_for('list_persons') }}">Back to list</a>
</body>
</html>
