<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='mystyle.css') }}">
</head>

<body>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
    <h1>Book List</h1>
    <a href="{{ url_for('create') }}">Add New Book</a>
    <ul>
        {% for book in books %}
        <li>
            "{{ book.title }}" by {{ book.author }}
            [<a href="{{ url_for('update', book_id=book.id) }}">Edit</a>]
            [<a href="{{ url_for('delete', book_id=book.id) }}">Delete</a>] 
        </li>
        {% endfor %}
    </ul>
</body>

</html>
